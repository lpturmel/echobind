[workspace]
members = [
    "crates/echobind-cli",
    "crates/echobind-core",
    "crates/echobind-desktop",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tracing = "0.1.41"
