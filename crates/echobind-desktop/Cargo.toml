[package]
name = "echobind-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "echobind-desktop"
path = "src/main.rs"

[dependencies]
cpal = "0.15.3"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }
echobind-core = { path = "../echobind-core" }
openh264 = "0.9.7"
opus = "0.3.0"
rayon = "1.10.0"
scap = "0.0.8"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3.19"

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = { version = "0.9.0", default-features = false, features = ["iosurface"] }
screencapturekit = "8.0.1"
videotoolbox = "0.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
# scap 0.0.8 uses the windows-capture 1.4 API. Both 1.3 and 1.5 have
# incompatible capture/frame/settings APIs despite satisfying its requirement.
libloading = "0.8.8"
moq-nvenc = "0.0.2"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
windows-capture = "=1.4.0"
